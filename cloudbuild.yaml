steps:
  - name: 'node:24'
    entrypoint: 'npm'
    args: ['ci']

  - name: 'node:24'
    entrypoint: 'npm'
    args: ['run', 'build']
    env:
      - 'NEXT_PUBLIC_API_URL=https://skripsi-backend-514828886605.asia-southeast2.run.app/api'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'app'
      - 'deploy'
      - 'app.yaml'
      - '--quiet'

options:
  logging: CLOUD_LOGGING_ONLY

timeout: '1200s'